# Publish what a GitHub Release names. release-plz cuts that release with a PAT, which is
# what lets it fire this workflow. It publishes only: the release pull request already swept
# this commit, so nothing is re-gated here.
name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Require the publishing secret
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::publishing needs the repository secret CARGO_REGISTRY_TOKEN (Settings → Secrets and variables → Actions)." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/publish-crate.sh "$TAG"
