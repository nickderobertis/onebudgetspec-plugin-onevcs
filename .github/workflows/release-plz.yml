# Conventional Commits on main drive the release: this tags and cuts the GitHub Release for a
# merged release pull request, then opens the next one and arms its auto-merge. The GitHub
# Release fires release.yml, which publishes; nothing here touches a registry.
name: release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # The job's own token only reads; every write uses RELEASE_PLZ_TOKEN.
    permissions:
      contents: read
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - name: Require the release secret
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLZ_TOKEN" ]; then
            echo "::error::release-plz needs the repository secret RELEASE_PLZ_TOKEN (Settings → Secrets and variables → Actions)." >&2
            exit 1
          fi
      - name: Is this push a merged release pull request?
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          branch="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null) | .head.ref][0] // ""')"
          case "$branch" in
            release-plz-*) echo "merged=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "merged=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v5
        if: steps.release-pr.outputs.merged == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.release-pr.outputs.merged == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.release-pr.outputs.merged == 'true'
        with:
          tool: release-plz
      - name: Tag and cut the GitHub Release
        if: steps.release-pr.outputs.merged == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: release-plz release --config release-plz.toml --git-token "$GITHUB_TOKEN"

  release-pr:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-pr
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Open or update the release pull request
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: release-plz release-pr --config release-plz.toml --git-token "$GITHUB_TOKEN"
      # Under the release PAT so the merge fires main's workflows; --auto waits for every
      # required check, and a merge already armed or under way is not a broken release.
      - name: Arm auto-merge on the release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq 'map(select(.headRefName | startswith("release-plz-"))) | .[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch \
              || echo "::warning::could not arm auto-merge on #$pr (already armed, or already merging)"
          fi
