[workspace]
resolver = "3"
members = ["crates/onebudgetspec-plugin-onevcs", "crates/onebudgetspec-plugin-onevcs-e2e", "crates/repo-checks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nickderobertis/onebudgetspec-plugin-onevcs"

[workspace.dependencies]
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.56", default-features = false }
onebudgetspec-core = "0.1.6"
onevcs = "0.61.1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_norway = "0.9"
toml = "1"
