[package]
name = "onebudgetspec-plugin-onevcs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deliver onebudgetspec reports and read saved base-branch budget history through onevcs"
readme = "../../README.md"
include = ["src/**", "Cargo.toml", "CHANGELOG.md", "../../README.md", "../../LICENSE"]

[[bin]]
name = "onebudgetspec-plugin-onevcs"
path = "src/main.rs"

# Dependencies whose types or trait impls appear in this crate's public API are declared
# here, not inherited from the workspace: adopting a new version then changes this
# directory, so its commit's conventional type decides the release (feat!/fix! for a
# breaking adoption). Shared requirements are kept in step by repo-checks.
[dependencies]
onebudgetspec-core = "0.2.1"
onevcs = "0.61.1"
serde = { version = "1", features = ["derive"] }
clap.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zip.workspace = true
