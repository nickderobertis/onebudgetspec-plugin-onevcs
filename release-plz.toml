# release-plz versions, tags and cuts the GitHub Release; .github/workflows/release.yml publishes.
[workspace]
publish = false
release_always = true
features_always_increment_minor = true
# The second alternative is the commit release-plz synthesizes when only a requirement the
# published crate inherits from the workspace changed: that adoption commit never touches
# the crate's directory, so release-plz never reads it. Dependencies in the crate's public
# API are declared in its own manifest instead, so their adoption's own type sets the bump.
release_commits = "^((feat|fix|perf|refactor|build)(\\([^)]+\\))?!?:|chore: update Cargo\\.toml dependencies$)"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
semver_check = false

[[package]]
name = "onebudgetspec-plugin-onevcs"
changelog_path = "crates/onebudgetspec-plugin-onevcs/CHANGELOG.md"

[[package]]
name = "onebudgetspec-plugin-onevcs-e2e"
release = false

[[package]]
name = "repo-checks"
release = false

[changelog]
commit_parsers = [
 { message = "^feat", group = "Added" },
 { message = "^fix", group = "Fixed" },
 { message = "^perf", group = "Performance" },
 { message = "^refactor", group = "Changed" },
 { message = "^build", group = "Build" },
 { message = "^chore: update Cargo\\.toml dependencies$", group = "Dependencies" },
 { message = ".*", skip = true },
]
